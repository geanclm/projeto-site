<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d16"><title>Indicadores — Apresentação Executiva</title><style>
:root{color-scheme:dark;--bg:#080d16;--panel:#111b2a;--line:#27374b;--text:#f0f5fa;--muted:#a4b3c5;--teal:#54e0c1;--blue:#82aeff;--red:#ff7c8a;--gold:#f3c879}*{box-sizing:border-box}body{margin:0;background:#050912;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer;color:var(--text)}.app{min-height:100vh;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 23px;border-bottom:1px solid #ffffff12;background:#080e19}.brand{display:flex;align-items:center;gap:11px;font-size:11px;letter-spacing:.13em;font-weight:800}.logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#133b37;border:1px solid #2b7169;color:var(--teal);font-size:16px}.top-meta{color:var(--muted);font-size:11px;letter-spacing:.04em}.actions{display:flex;gap:7px}.btn{background:#121f31;border:1px solid #31435a;border-radius:9px;padding:8px 12px;font-size:12px}.btn:hover{border-color:var(--teal)}.stage{flex:1;display:grid;place-items:center;padding:25px 20px 82px;position:relative}.slide{display:none;width:min(1220px,100%);aspect-ratio:16/9;max-height:calc(100vh - 170px);min-height:570px;background:radial-gradient(ellipse at 83% 0%,#1b3b4b 0%,transparent 37%),linear-gradient(145deg,#101c2c,#0b111c 75%);border:1px solid #26364a;border-radius:23px;box-shadow:0 35px 120px #0008;overflow:hidden;position:relative;padding:clamp(27px,4.1vw,60px);flex-direction:column;justify-content:center}.slide.active{display:flex;animation:fadein .28s ease-out}@keyframes fadein{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}.slide:after{content:"";position:absolute;inset:auto -70px -190px auto;width:370px;height:370px;border-radius:50%;border:1px solid #ffffff0a;box-shadow:0 0 0 35px #ffffff04,0 0 0 80px #ffffff02;pointer-events:none}.eyebrow{font-size:10px;color:var(--teal);letter-spacing:.18em;text-transform:uppercase;font-weight:850;margin-bottom:16px}.slide h1{font-size:clamp(32px,4.1vw,60px);letter-spacing:-.05em;line-height:1.03;margin:0 0 20px;max-width:900px}.slide h2{font-size:clamp(25px,3.05vw,43px);letter-spacing:-.04em;line-height:1.08;margin:0 0 24px;max-width:1000px}.lead{color:#bac8d9;font-size:clamp(15px,1.45vw,20px);max-width:770px;line-height:1.55}.cover-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:32px}.chip{border:1px solid #30445d;background:#111e2d;padding:8px 12px;border-radius:999px;color:#c0d0df;font-size:11px}.cover-mark{position:absolute;right:7%;bottom:13%;width:185px;height:185px;border-radius:50%;border:1px solid #55e0c125;display:grid;place-items:center;color:#54e0c1;font-size:70px;font-weight:200}.cover-mark:before,.cover-mark:after{content:"";position:absolute;inset:17px;border:1px solid #55e0c11b;border-radius:50%}.cover-mark:after{inset:-17px}.content-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center}.bullets{display:flex;flex-direction:column;gap:13px;padding:0;margin:0;list-style:none}.bullets li{position:relative;padding-left:25px;color:#c5d0de;font-size:clamp(13px,1.3vw,17px);line-height:1.45}.bullets li:before{content:"";position:absolute;top:.55em;left:0;width:8px;height:8px;border-radius:3px;background:var(--teal);box-shadow:0 0 12px #54e0c130}.takeaway{border-left:2px solid var(--teal);background:linear-gradient(90deg,#153a3488,transparent);padding:14px 18px;color:#e1edea;font-size:clamp(13px,1.2vw,16px);line-height:1.5;margin-top:23px;max-width:1000px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:2px 0 16px}.metric{padding:13px 14px;border:1px solid #2b3b50;background:#111c2b;border-radius:13px;min-width:0}.metric .label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#91a4bb}.metric .val{font-size:clamp(18px,2vw,28px);font-weight:780;letter-spacing:-.04em;margin:8px 0 3px}.metric .delta{font-size:11px;color:var(--muted)}.positive{color:var(--teal)!important}.negative{color:var(--red)!important}.neutral{color:var(--gold)!important}.chart{display:flex;flex-direction:column;gap:10px;margin:8px 0 2px}.bar-row{display:grid;grid-template-columns:minmax(95px,170px) 1fr 70px;gap:12px;align-items:center;font-size:11px;color:#b6c5d6}.bar-track{height:10px;background:#202e40;border-radius:99px;overflow:hidden}.bar-fill{height:100%;border-radius:99px;background:var(--teal)}.bar-fill.negative{background:var(--red)!important}.bar-fill.blue{background:var(--blue)}.bar-value{text-align:right;font-variant-numeric:tabular-nums;font-weight:750}.bottom-note{font-size:10px;color:#7f93a9;margin-top:12px}.foot{position:absolute;bottom:22px;left:clamp(27px,4.1vw,60px);right:clamp(27px,4.1vw,60px);display:flex;justify-content:space-between;gap:15px;color:#72869d;font-size:10px;text-transform:uppercase;letter-spacing:.07em}.progress-wrap{height:3px;background:#121b28}.progress{height:100%;background:var(--teal);width:0;transition:width .2s}.bottom-controls{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:13px 22px;background:#080e19eF;border-top:1px solid #ffffff12;backdrop-filter:blur(14px);z-index:5}.counter{font-variant-numeric:tabular-nums;font-size:12px;color:#a6b7c9;min-width:75px}.nav{display:flex;align-items:center;gap:8px}.nav .btn{min-width:80px}.hint{font-size:10px;color:#6e829b}.overview{display:none;position:fixed;inset:0;z-index:10;background:#050912f5;overflow:auto;padding:30px}.overview.show{display:block}.overview-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.overview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.thumb{aspect-ratio:16/9;border:1px solid #33465e;border-radius:12px;background:linear-gradient(145deg,#182a3c,#0b111c);padding:13px;text-align:left}.thumb span{font-size:10px;color:var(--teal)}.thumb strong{display:block;font-size:13px;margin-top:10px;line-height:1.3}.thumb:hover{border-color:var(--teal)}@media(max-width:760px){.top{padding:12px}.top-meta{display:none}.stage{padding:14px 9px 76px}.slide{aspect-ratio:auto;min-height:calc(100vh - 150px);max-height:none;border-radius:16px;padding:25px 20px 62px}.slide h1{font-size:38px}.slide h2{font-size:28px}.cover-mark{width:100px;height:100px;font-size:38px;right:8%;bottom:10%}.content-grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metric .val{font-size:21px}.bottom-controls{padding:10px}.hint{display:none}.nav .btn{min-width:auto;padding:8px 10px}.foot{bottom:15px;left:20px;right:20px}.foot span:first-child{display:none}.bar-row{grid-template-columns:90px 1fr 55px;gap:8px}.overview{padding:17px}}@media print{body{background:white}.top,.bottom-controls,.progress-wrap,.overview{display:none!important}.stage{display:block;padding:0}.slide{display:flex!important;page-break-after:always;break-after:page;width:100%;height:100vh;max-height:none;min-height:0;border-radius:0;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}.slide:last-child{page-break-after:auto}}
</style></head><body><div class="app"><header class="top"><div class="brand"><span class="logo">I</span> INDICADORES / LAB</div><div class="top-meta">APRESENTAÇÃO EXECUTIVA · SNAPSHOT 09 OUT 2026</div><div class="actions"><button class="btn" id="overviewBtn">Visão geral</button><button class="btn" id="printBtn">Imprimir / PDF</button></div></header><div class="progress-wrap"><div class="progress" id="progress"></div></div><main class="stage" id="stage"></main><footer class="bottom-controls"><div class="counter" id="counter">01 / 15</div><div class="hint">Use ← → para navegar · O: visão geral · Esc: fechar</div><div class="nav"><button class="btn" id="prev">← Anterior</button><button class="btn" id="next">Próximo →</button></div></footer></div><div class="overview" id="overview"><div class="overview-head"><div><div class="eyebrow">ÍNDICE DA APRESENTAÇÃO</div><h2>Ir para um slide</h2></div><button class="btn" id="closeOverview">Fechar ✕</button></div><div class="overview-grid" id="overviewGrid"></div></div><script>
const SLIDES = [{"eyebrow":"INDICADORES / LAB · BRIEFING EXECUTIVO","title":"O cenário em um snapshot","sub":"09 outubro 2026 · 12:48 BRT","body":"Leitura integrada de mercados, macroeconomia, ativos reais, cripto e tecnologia a partir da base fornecida.","note":"Não é uma previsão nem uma atualização em tempo real.","type":"cover"},{"eyebrow":"01 / ESCOPO","title":"O que esta leitura cobre","bullets":["80 registros em 10 grupos temáticos, extraídos do arquivo Markdown anexado.","O retrato combina mercados globais, juros, câmbio, Brasil, commodities, criptoativos, tecnologia e rankings.","Os valores são tratados como observações do snapshot de 09/10/2026; não foram substituídos por cotações externas."],"takeaway":"A análise descreve o que a base reporta — não certifica a origem de cada série."},{"eyebrow":"02 / MENSAGEM CENTRAL","title":"Sinais construtivos coexistem com restrições","bullets":["Índices acionários dos EUA e Ibovespa avançam no recorte.","O VIX recua, mas o Treasury de 10 anos permanece em 5,26% e sobe na coluna de variação.","Commodities metálicas sobem; moedas estrangeiras recuam frente ao real; criptoativos sobem, ainda abaixo das EMAs de referência citadas."],"takeaway":"O conjunto é misto: não cabe resumir o snapshot como um sinal único de ‘risk-on’ ou ‘risk-off’."},{"eyebrow":"03 / MERCADOS GLOBAIS","title":"Ações sobem; volatilidade implícita cede","metrics":[["S&P 500","7.798,15","+0,42%"],["Nasdaq Composite","31.065","+0,31%"],["Dow Jones","51.482","+0,49%"],["VIX","14,91","−3,24%"]],"chart":"us","takeaway":"A combinação é consistente com menor tensão de curto prazo no snapshot; não indica por si só a direção futura."},{"eyebrow":"04 / TAXAS DOS EUA","title":"A curva abre, com o juro longo em nível elevado","metrics":[["Fed Funds","4,00% a.a.","+0,25%"],["Treasury 2Y","4,77%","−0,42%"],["Treasury 10Y","5,26%","+0,61%"],["Spread 10Y–2Y","0,51 p.p.","+6,25%"]],"chart":"rates","takeaway":"A curva positiva não basta para afirmar aceleração econômica; combine-a com inflação, dados de atividade e comunicação do Fed."},{"eyebrow":"05 / INFRAESTRUTURA DE IA","title":"Desempenho heterogêneo entre empresas de tecnologia","metrics":[["NVIDIA","+0,10%","variação"],["TSMC","−1,46%","variação"],["ASML","+1,19%","variação"],["SpaceX","+1,72%","variação"],["CXMT","+3,36%","variação"]],"chart":"tech","takeaway":"A cadeia não se move como um bloco único no snapshot. Não inferir força setorial a partir de poucas empresas."},{"eyebrow":"06 / CÂMBIO","title":"Moedas estrangeiras recuam frente ao real","metrics":[["Dólar","R$ 4,98","−0,75%"],["Euro","R$ 5,57","−0,82%"],["Libra","R$ 6,59","−0,57%"],["Iene","R$ 0,0313","−1,33%"],["DXY","102,28","+0,13%"]],"takeaway":"DXY ligeiramente em alta e moedas contra o real em queda descrevem referências diferentes. Não são sinais contraditórios sem considerar cestas e pares."},{"eyebrow":"07 / MACRO BRASIL","title":"Juros nominais elevados e inflação com sinais diferentes","metrics":[["SELIC","13,75% a.a.","−1,79%"],["CDI","13,65% a.a.","0,00%"],["IPCA","4,58% a.a.","+8,53%"],["IGP-M","1,57% a.m.","+1,79%"],["Juro real informado","8,67% a.a.","0,00%"]],"takeaway":"Antes de automatizar a narrativa, explicite periodicidade, fórmula do juro real e janela da coluna de variação."},{"eyebrow":"08 / ATIVIDADE & FISCAL","title":"Atividade e PIB positivos; dívida exige contexto","metrics":[["IBC-Br","114,4 pts","+4,06%"],["PIB trimestral","R$ 3,43 tri","+5,38%"],["DLSP","R$ 8,2 tri","+1,24%"]],"takeaway":"Os percentuais da base não trazem, linha a linha, o horizonte comparável. Não os rotule como crescimento mensal, trimestral ou anual sem metadados."},{"eyebrow":"09 / MERCADO BRASILEIRO","title":"Ibovespa avança; IFIX fica estável no recorte","metrics":[["Ibovespa","209.497 pts","+1,59%"],["IFIX","3.980,1 pts","0,00%"],["ETF proxy XFIX11","R$ 14,03","+0,57%"],["IMA-B / IMAB11","R$ 125,28","+1,06%"]],"takeaway":"A leitura local é favorável para ações e títulos indexados à inflação no registro fornecido, mas um único snapshot não comprova tendência."},{"eyebrow":"10 / COMMODITIES & CLIMA","title":"Metais em alta; energia e clima merecem monitoramento","metrics":[["Brent","US$ 104,76/bbl","+0,46%"],["Cobre","US$ 6,69/lb","+2,62%"],["Ouro","R$ 674,72/g","+1,34%"],["Prata","R$ 9,80/g","+3,57%"],["Platina","R$ 271,62/g","+4,32%"],["ONI","+1,5 °C","+0,49%"],["BDI","2.973 pts","−0,70%"]],"takeaway":"O arquivo sinaliza um possível conjunto de pressões e riscos para acompanhar; causalidade e efeito inflacionário precisam de confirmação externa."},{"eyebrow":"11 / CRIPTOATIVOS","title":"Alta diária não elimina a distância da média curta","metrics":[["Bitcoin","US$ 82.890,90","+1,49%"],["EMA7 D−1 do BTC","US$ 83.952,66","referência"],["Ethereum","US$ 2.488,51","+0,67%"],["EMA7 D−1 do ETH","US$ 2.618,31","referência"]],"chart":"crypto","takeaway":"Segundo os dados fornecidos, BTC e ETH sobem na variação reportada, mas seguem abaixo da referência EMA7 D−1. É um diagnóstico pontual, não recomendação de compra/venda."},{"eyebrow":"12 / EMPRESAS & FINTECH","title":"Nu Holdings lidera as variações selecionadas deste grupo","metrics":[["Nu Holdings","US$ 16,00","+4,06%"],["Visa","US$ 383,21","+2,16%"],["MercadoLibre","US$ 1.871,76","+0,81%"],["Saudi Aramco","SAR 25,74","−0,39%"],["Reliance","INR 1.170,30","−0,65%"]],"takeaway":"A observação combina instrumentos e moedas diferentes. Use as variações para triagem e preserve moeda, unidade e fonte na camada de dados."},{"eyebrow":"13 / TECNOLOGIA & BENCHMARKS","title":"Rankings, ratings e sucesso de agentes não são a mesma métrica","bullets":["Python permanece em 1º no ranking descrito, com rating de 17,76% e variação de −8,22%.","Os indicadores ‘Arena AI’ apresentam números de rankings/scores, mas a base não descreve escala, amostra ou metodologia de todos eles.","O benchmark de agentes registra sucesso confirmado de 13,93%, elogios de 33,69% e reclamações de 9,12%; denominadores não foram detalhados no arquivo."],"takeaway":"Não combine scores de arenas, ratings percentuais e taxas de sucesso numa classificação única sem normalização e metodologia."},{"eyebrow":"14 / QUALIDADE DOS DADOS","title":"Antes de automatizar, torne a base auditável","bullets":["Definir timestamp, fuso, periodicidade e janela de variação de cada série.","Separar valor, unidade, moeda, fonte, ranking, market cap e contexto em colunas tipadas.","Revisar linhas com delimitadores incorporados; conservar o dado bruto e um campo normalizado.","Recalcular o juro real com fórmula explícita; validar escalas e denominadores de benchmarks.","Adicionar checagens de atualização, valores ausentes e outliers antes de gerar insights."],"takeaway":"Prioridade de engenharia: dicionário de dados + validação automatizada + trilha de proveniência."},{"eyebrow":"15 / DECISÕES & WATCHLIST","title":"Uma agenda executiva para o próximo snapshot","bullets":["Mercados globais: acompanhar VIX, Treasury 10Y, curva 10Y–2Y e spreads de crédito.","Brasil: acompanhar SELIC/CDI, IPCA/IGP-M, juro real, dólar e Ibovespa em janelas consistentes.","Commodities: revisar Brent, cobre, BDI, ONI e agrícolas para testar hipóteses sobre custos.","Ativos digitais: comparar preço vs. EMA7 e registrar horizonte e fonte.","Dados: publicar um score de qualidade por série antes de gerar narrativas LLM."],"takeaway":"Conclusão: snapshot útil como radar; decisão robusta depende de séries temporais, fontes rastreáveis e validação de unidade/horizonte."}];
const stage=document.getElementById('stage');let current=0;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function deltaClass(s){return /−|-/.test(s)?'negative':/\+/.test(s)?'positive':'neutral'}
function metrics(items){return `<div class="metrics">${items.map(x=>`<div class="metric"><div class="label">${esc(x[0])}</div><div class="val">${esc(x[1])}</div><div class="delta ${deltaClass(x[2])}">${esc(x[2])}</div></div>`).join('')}</div>`}
function bars(kind){let d=[];if(kind==='us')d=[['S&P 500',.42],['Nasdaq',.31],['Dow Jones',.49],['VIX',-3.24]];if(kind==='rates')d=[['Fed Funds',.25],['Treasury 2Y',-.42],['Treasury 10Y',.61],['Curva 10Y–2Y',6.25]];if(kind==='tech')d=[['NVIDIA',.10],['TSMC',-1.46],['ASML',1.19],['SpaceX',1.72],['CXMT',3.36]];if(kind==='crypto')d=[['Bitcoin',1.49],['Dist. EMA7 BTC',-1.26],['Ethereum',.67],['Dist. EMA7 ETH',-4.96]];let max=Math.max(...d.map(x=>Math.abs(x[1])),1);return `<div class="chart">${d.map(([n,v])=>`<div class="bar-row"><span>${esc(n)}</span><div class="bar-track"><div class="bar-fill ${v<0?'negative':''} ${kind==='rates'&&v>0?'blue':''}" style="width:${Math.max(3,Math.abs(v)/max*100)}%"></div></div><span class="bar-value ${v>0?'positive':v<0?'negative':'neutral'}">${v>0?'+':''}${v.toFixed(2).replace('.',',')}%</span></div>`).join('')}</div>`}
function slideHtml(s,i){let inside='';if(s.type==='cover'){inside=`<div class="eyebrow">${esc(s.eyebrow)}</div><h1>${esc(s.title)}</h1><p class="lead">${esc(s.sub)}<br>${esc(s.body)}</p><div class="cover-meta"><span class="chip">80 registros</span><span class="chip">10 grupos temáticos</span><span class="chip">15 slides</span><span class="chip">Snapshot fornecido pelo usuário</span></div><div class="cover-mark">I</div><div class="takeaway">${esc(s.note)}</div>`}else{inside=`<div class="eyebrow">${esc(s.eyebrow)}</div><h2>${esc(s.title)}</h2>`;if(s.metrics)inside+=metrics(s.metrics);if(s.chart)inside+=bars(s.chart);if(s.bullets)inside+=`<ul class="bullets">${s.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`;if(s.takeaway)inside+=`<div class="takeaway"><b>Implicação executiva · </b>${esc(s.takeaway)}</div>`;if(s.chart)inside+=`<div class="bottom-note">Variações e relações calculadas a partir do snapshot fornecido; não são previsões nem recomendação de investimento.</div>`}return `<section class="slide ${i===0?'active':''}" data-index="${i}">${inside}<div class="foot"><span>INDICADORES / LAB · BRIEFING EXECUTIVO</span><span>SNAPSHOT 09.10.2026 · DADOS DO ARQUIVO</span><span>${String(i+1).padStart(2,'0')} / ${SLIDES.length}</span></div></section>`}
stage.innerHTML=SLIDES.map(slideHtml).join('');
const slideEls=[...document.querySelectorAll('.slide')];
function go(i){current=Math.max(0,Math.min(SLIDES.length-1,i));slideEls.forEach((s,j)=>s.classList.toggle('active',j===current));document.getElementById('counter').textContent=`${String(current+1).padStart(2,'0')} / ${SLIDES.length}`;document.getElementById('progress').style.width=((current+1)/SLIDES.length*100)+'%';document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===SLIDES.length-1;document.getElementById('prev').style.opacity=current===0?'.4':'1';document.getElementById('next').style.opacity=current===SLIDES.length-1?'.4':'1';}
function openOverview(){document.getElementById('overview').classList.add('show')}function closeOverview(){document.getElementById('overview').classList.remove('show')}
document.getElementById('overviewGrid').innerHTML=SLIDES.map((s,i)=>`<button class="thumb" data-go="${i}"><span>SLIDE ${String(i+1).padStart(2,'0')}</span><strong>${esc(s.title)}</strong></button>`).join('');
document.getElementById('overviewGrid').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){go(+b.dataset.go);closeOverview()}});document.getElementById('overviewBtn').addEventListener('click',openOverview);document.getElementById('closeOverview').addEventListener('click',closeOverview);document.getElementById('prev').addEventListener('click',()=>go(current-1));document.getElementById('next').addEventListener('click',()=>go(current+1));document.getElementById('printBtn').addEventListener('click',()=>window.print());document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){if(!document.getElementById('overview').classList.contains('show'))go(current+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){if(!document.getElementById('overview').classList.contains('show'))go(current-1)}else if(e.key.toLowerCase()==='o'){openOverview()}else if(e.key==='Escape'){closeOverview()}});go(0);
</script></body></html>
